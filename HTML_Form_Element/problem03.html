<!DOCTYPE html>
<html>
<head>
    <title>Online Course Enrollment</title>
</head>
<body>

    <h1>Online Course Enrollment & Student Registration</h1>

    <p>
        Register for a technical course and select your preferred learning
        mode and areas of interest.
    </p>

    <img src="https://via.placeholder.com/600x150?text=Online+Learning"
         alt="Online Learning">

    <p>
        <a href="https://www.coursera.org/" target="_blank">
            View Course Information
        </a>
    </p>

    <hr>

    <form action="#" method="post">

        <h2>Account Information</h2>

        <label for="student_name">Student Name:</label><br>
        <input type="text" id="student_name" name="student_name"
               minlength="3" maxlength="60"
               placeholder="Enter your name"
               autocomplete="name" required>
        <br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email"
               placeholder="student@example.com"
               autocomplete="email" required>
        <br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password"
               minlength="8" maxlength="20" required>
        <br><br>

        <label for="mobile">Mobile Number:</label><br>
        <input type="tel" id="mobile" name="mobile"
               pattern="[0-9]{10}" maxlength="10"
               placeholder="10-digit number"
               autocomplete="tel" required>
        <br><br>

        <label for="dob">Date of Birth:</label><br>
        <input type="date" id="dob" name="date_of_birth"
               min="1990-01-01" max="2010-12-31" required>

        <hr>

        <h2>Course Details</h2>

        <label for="course">Select Course:</label><br>
        <select id="course" name="course" required>
            <option value="">-- Select Course --</option>
            <option value="python">Python Programming</option>
            <option value="java">Java Programming</option>
            <option value="web">Web Development</option>
            <option value="aiml">Artificial Intelligence & ML</option>
            <option value="datascience">Data Science</option>
            <option value="cybersecurity">Cyber Security</option>
            <option value="cloud">Cloud Computing</option>
        </select>

        <br><br>

        <label for="batch">Select Batch:</label><br>
        <select id="batch" name="batch" required>
            <option value="">-- Select Batch --</option>
            <option value="morning">Morning Batch</option>
            <option value="afternoon">Afternoon Batch</option>
            <option value="evening">Evening Batch</option>
            <option value="weekend">Weekend Batch</option>
        </select>

        <br><br>

        <p>Learning Mode:</p>

        <input type="radio" id="online" name="learning_mode" value="online" required>
        <label for="online">Online</label>

        <input type="radio" id="offline" name="learning_mode" value="offline">
        <label for="offline">Offline</label>

        <input type="radio" id="hybrid" name="learning_mode" value="hybrid">
        <label for="hybrid">Hybrid</label>

        <br><br>

        <p>Areas of Interest:</p>

        <input type="checkbox" id="java" name="interest" value="java">
        <label for="java">Java</label><br>

        <input type="checkbox" id="python" name="interest" value="python">
        <label for="python">Python</label><br>

        <input type="checkbox" id="web" name="interest" value="web_development">
        <label for="web">Web Development</label><br>

        <input type="checkbox" id="ds" name="interest" value="data_structures">
        <label for="ds">Data Structures</label><br>

        <input type="checkbox" id="database" name="interest" value="database">
        <label for="database">Database</label>

        <hr>

        <h2>Educational Background</h2>

        <label for="education">Education Level:</label><br>
        <select id="education" name="education_level" required>
            <option value="">-- Select --</option>
            <option value="intermediate">Intermediate / 12th</option>
            <option value="diploma">Diploma</option>
            <option value="undergraduate">Undergraduate</option>
            <option value="postgraduate">Postgraduate</option>
        </select>

        <br><br>

        <label for="college">College / Institution:</label><br>
        <input type="text" id="college" name="college"
               minlength="3" maxlength="100" required>
        <br><br>

        <label for="semester">Current Semester / Year:</label><br>
        <input type="text" id="semester" name="current_semester"
               maxlength="30" placeholder="Example: 1st Semester" required>
        <br><br>

        <label for="experience">Programming Experience (years):</label><br>
        <input type="number" id="experience" name="programming_experience"
               min="0" max="20" step="0.5" value="0">
        <br><br>

        <label for="github">GitHub / Portfolio URL:</label><br>
        <input type="url" id="github" name="portfolio_url"
               placeholder="https://github.com/username">
        <br><br>

        <label for="goals">Learning Goals:</label><br>
        <textarea id="goals" name="learning_goals"
                  rows="6" cols="50"
                  minlength="10" maxlength="500"
                  placeholder="Describe what you want to learn"
                  required></textarea>

        <br><br>

        <input type="checkbox" id="confirmation"
               name="confirmation" value="confirmed" required>
        <label for="confirmation">
            I confirm that the information provided is correct.
        </label>

        <br><br>

        <input type="submit" value="Enroll Now">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
